<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Movie seats booking</title>
		<link rel="stylesheet" href="style.css" />
		<script src="script.js" defer></script>
	</head>
	<body>
		<div class="reservation">
			<div class="reservation__selector">
				<label>Pick a movie:</label>
				<select id="movie-select" class="reservation__select"></select>
			</div>

			<ul class="reservation__legend">
				<li class="reservation__legend-item">
					<div class="seat"></div>
					<small>N/A</small>
				</li>
				<li class="reservation__legend-item">
					<div class="seat seat--selected"></div>
					<small>Selected</small>
				</li>
				<li class="reservation__legend-item">
					<div class="seat seat--occupied"></div>
					<small>Occupied</small>
				</li>
			</ul>

			<div class="cinema">
				<div class="cinema__screen"></div>
				<div class="cinema__hall">
					<div class="cinema__group cinema__group--cols2">
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
					</div>

					<div class="cinema__group cinema__group--cols4">
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
					</div>

					<div class="cinema__group cinema__group--cols2">
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
						<div class="seat"></div>
					</div>
				</div>
			</div>

			<p class="reservation__receip">
				You have selected
				<span id="selected-seat-count" class="reservation__receip-span">0</span>
				seats for a price of $<span
					id="total-price"
					class="reservation__receip-span"
					>0</span
				>
			</p>
		</div>
	</body>
</html>
