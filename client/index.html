<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Movie seats booking</title>
		<link rel="stylesheet" href="style.css" />
		<script type="module" src="main.js"></script>
	</head>
	<body>
		<div class="reservation">
			<div class="reservation__switcher">
				<label>Pick a movie:</label>
				<select id="movie-dropdown" class="reservation__dropdown"></select>
			</div>

			<ul class="reservation__legend">
				<li class="reservation__legend-item">
					<div class="seat"></div>
					<small>N/A</small>
				</li>
				<li class="reservation__legend-item">
					<div class="seat seat--selected"></div>
					<small>Selected</small>
				</li>
				<li class="reservation__legend-item">
					<div class="seat seat--occupied"></div>
					<small>Occupied</small>
				</li>
			</ul>

			<div class="cinema">
				<div class="cinema__screen"></div>
				<div class="cinema__hall"></div>
			</div>

			<p class="reservation__receipt">
				You have selected
				<span id="selected-seat-count" class="reservation__receipt-span"
					>0</span
				>
				seats for a price of $<span
					id="total-price"
					class="reservation__receipt-span"
					>0</span
				>
			</p>

			<button
				class="reservation__button reservation__button--inactive"
				type="button"
			>
				RESERVE
			</button>

			<button id="init-storage" type="button">init storage</button>
		</div>
	</body>
</html>
